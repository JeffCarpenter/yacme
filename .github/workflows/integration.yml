name: Integration Tests

on:
  push:
  pull_request:

jobs:
  pebble-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pebble and docker-compose
        run: |
          sudo apt-get update
          # Ubuntu provides the ACME (RFC 8555) pebble test server package.
          sudo apt-get install -y pebble docker-compose-plugin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run pebble integration tests
        env:
          RUST_BACKTRACE: 1
        run: |
          # The tests manage the Pebble lifecycle via docker-compose internally.
          cargo test --features pebble --tests
