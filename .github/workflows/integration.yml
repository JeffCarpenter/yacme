name: Integration Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pebble-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install docker-compose plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin

      - name: Pull Pebble test containers
        run: |
          set -euo pipefail
          docker compose -f pebble/docker-compose.yml pull

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run pebble integration tests
        env:
          RUST_BACKTRACE: 1
        run: |
          # The tests manage the Pebble lifecycle via docker-compose internally.
          cargo test --features pebble --tests -- --nocapture
