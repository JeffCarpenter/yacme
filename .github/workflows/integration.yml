name: Integration Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pebble-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pebble and ensure docker compose is available
        run: |
          set -euo pipefail
          sudo apt-get update
          # Removed unnecessary installation of pebble package
          if ! docker compose version >/dev/null 2>&1; then
            sudo apt-get install -y docker-compose-plugin || sudo apt-get install -y docker-compose
            if ! docker compose version >/dev/null 2>&1 && command -v docker-compose >/dev/null 2>&1; then
              sudo mkdir -p /usr/lib/docker/cli-plugins
              sudo ln -sf "$(command -v docker-compose)" /usr/lib/docker/cli-plugins/docker-compose
            fi
          fi
          docker compose version

      - name: Pull Pebble test containers
        run: |
          set -euo pipefail
          docker compose -f pebble/docker-compose.yml pull

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Show rustc version
        run: rustc --version

      - name: Run pebble integration tests
        env:
          RUST_BACKTRACE: 1
        run: |
          # The tests manage the Pebble lifecycle via docker-compose internally.
          cargo test --features pebble --tests -- --nocapture
